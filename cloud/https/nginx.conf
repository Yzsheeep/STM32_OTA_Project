# Standalone Linux host-network container. Mount as /etc/nginx/nginx.conf.
worker_processes 1;
events { worker_connections 256; }

http {
    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate /etc/letsencrypt/live/f411-ota-ip/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/f411-ota-ip/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location ~ "^/api/v1/targets/f411-ota/(latest|releases/[0-9]+[.][0-9]+[.][0-9]+/firmware[.]bin)$" {
            if ($request_method != GET) { return 405; }
            proxy_pass_request_headers off;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_pass http://127.0.0.1:18080$uri;
        }

        location / { return 404; }
    }
}
